<svg xmlns="http://www.w3.org/2000/svg" width="960" height="634" viewBox="0 0 960 634" role="img" aria-labelledby="title desc">
<title id="title">A 131.072 kHz pulse becomes a 1.228 kHz alias</title>
<desc id="desc">At 44.1 kHz, point sampling yields a large audible waveform. Integrating the oscillator and filtering before decimation leaves a flat trace on the same amplitude scale.</desc>
<rect width="960" height="634" rx="22" fill="#101a22"/>
<rect x="18" y="18" width="924" height="598" rx="12" fill="none" stroke="#31404b" stroke-width="2"/>
<g font-family="sans-serif">
<text x="55" y="73" font-size="21" font-weight="700" letter-spacing="3" fill="#a1b4bf">PYGAMEBOY SIGNAL TRACE</text>
<text x="55" y="135" font-size="50" font-weight="750" fill="#edf4ed">131.072 kHz pulse</text>
<text x="55" y="172" font-size="24" fill="#a1b4bf">Two outputs at 44,100 samples per second</text>
<path d="M 55 194 H 905" stroke="#31404b" stroke-width="2"/>
</g>
<text x="55" y="249" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffbd73">POINT SAMPLED</text>
<text x="905" y="249" text-anchor="end" font-family="sans-serif" font-size="24" fill="#ffbd73">1.228 kHz alias</text>
